<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
<title>EPUB Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #FFF9F0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#content {
  padding: 20px;
  color: #333;
  font-family: serif;
  line-height: 1.8;
  word-wrap: break-word;
  -webkit-text-size-adjust: 100%;
}
#content p { text-indent: 2em; margin: 0.5em 0; }
#content img { max-width: 100%; height: auto; display: block; margin: 0.5em auto; break-inside: avoid; }
#content h1, #content h2, #content h3, #content h4, #content h5, #content h6 { margin: 1em 0 0.5em; line-height: 1.3; break-inside: avoid; break-after: avoid; }
#content a { color: #FF8C00; text-decoration: none; cursor: pointer; }
#content .epub-chapter { position: relative; }
#toc-panel { position: fixed; top: 0; left: 0; width: 75%; height: 100%; background: #FFFFFF; z-index: 100; overflow-y: auto; transform: translateX(-100%); transition: transform 0.25s ease; box-shadow: 2px 0 8px rgba(0,0,0,0.15); }
#toc-panel.open { transform: translateX(0); }
#toc-panel .toc-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #E5E5E5; background: #FFF9F0; }
#toc-panel .toc-header h2 { font-size: 18px; color: #333; margin: 0; }
#toc-panel .toc-close { font-size: 24px; color: #999; cursor: pointer; border: none; background: none; }
#toc-panel .toc-list { padding: 8px 0; }
#toc-panel .toc-item { display: block; padding: 12px 20px; font-size: 14px; color: #333; text-decoration: none; border-bottom: 1px solid #F5F5F5; }
#toc-panel .toc-item:hover, #toc-panel .toc-item:active { background: #FFF3E0; }
#toc-panel .toc-empty { padding: 40px 20px; text-align: center; color: #999; font-size: 14px; }
#toc-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 99; display: none; }
#toc-overlay.show { display: block; }
body.dark-mode { background-color: #1A1A1A !important; }
body.dark-mode #content { background-color: #1A1A1A !important; color: #D4D4D4 !important; }
body.dark-mode #content p, body.dark-mode #content div, body.dark-mode #content span, body.dark-mode #content li { color: #D4D4D4 !important; }
body.dark-mode #content h1, body.dark-mode #content h2, body.dark-mode #content h3,
body.dark-mode #content h4, body.dark-mode #content h5, body.dark-mode #content h6 { color: #E0E0E0 !important; }
body.dark-mode #content a { color: #FFB74D !important; }
body.dark-mode #content table { color: #D4D4D4 !important; }
body.dark-mode #loading { color: #999999 !important; }
body.dark-mode #loading .spinner { border-color: #3A3A3A !important; border-top-color: #FF8C00 !important; }
body.dark-mode #toc-panel { background: #2D2D2D !important; }
body.dark-mode #toc-panel .toc-header { background: #1A1A1A !important; border-bottom-color: #3A3A3A !important; }
body.dark-mode #toc-panel .toc-header h2 { color: #E0E0E0 !important; }
body.dark-mode #toc-panel .toc-close { color: #999999 !important; }
body.dark-mode #toc-panel .toc-item { color: #D4D4D4 !important; border-bottom-color: #3A3A3A !important; }
body.dark-mode #toc-panel .toc-item:hover, body.dark-mode #toc-panel .toc-item:active { background: #3A3A3A !important; }
body.dark-mode #toc-panel .toc-empty { color: #666666 !important; }
#content table { max-width: 100%; overflow-x: auto; }
#loading { text-align: center; padding: 60px 20px; color: #666; font-size: 16px; }
#loading .spinner { width: 36px; height: 36px; margin: 0 auto 16px; border: 3px solid #eee; border-top-color: #FF8C00; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#error { text-align: center; padding: 60px 20px; color: #c00; font-size: 16px; display: none; }
#error .hint { color: #999; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <p>正在加载EPUB阅读器...</p>
</div>
<div id="error">
  <p>EPUB加载失败</p>
  <p class="hint">请检查网络连接后重试</p>
</div>
<style id="epub-css"></style>
<div id="content"></div>
<div id="toc-overlay"></div>
<div id="toc-panel">
  <div class="toc-header">
    <h2>目录</h2>
    <button class="toc-close" id="toc-close-btn">&times;</button>
  </div>
  <div class="toc-list" id="toc-list"></div>
</div>
<script>
function hideLoading() {
  document.getElementById('loading').style.display = 'none';
}

function showError() {
  hideLoading();
  document.getElementById('error').style.display = 'block';
}

function resolvePath(base, relative) {
  if (!relative) return base;
  if (relative.charAt(0) === '/' || relative.indexOf('http') === 0) return relative;
  var parts = base.split('/');
  parts.pop();
  var relParts = relative.split('/');
  for (var i = 0; i < relParts.length; i++) {
    if (relParts[i] === '..') {
      parts.pop();
    } else if (relParts[i] !== '.') {
      parts.push(relParts[i]);
    }
  }
  return parts.join('/');
}

var zipInstance = null;
var opfDir = '';

function getMimeType(path) {
  var ext = path.split('.').pop().toLowerCase();
  if (ext === 'jpg' || ext === 'jpeg') return 'image/jpeg';
  if (ext === 'png') return 'image/png';
  if (ext === 'gif') return 'image/gif';
  if (ext === 'svg') return 'image/svg+xml';
  if (ext === 'webp') return 'image/webp';
  return 'image/png';
}

async function processImages() {
  var images = document.querySelectorAll('#content img');
  for (var i = 0; i < images.length; i++) {
    var img = images[i];
    var src = img.getAttribute('src');
    if (src && src.indexOf('http') !== 0 && src.indexOf('data:') !== 0 && zipInstance) {
      var imagePath = resolvePath(opfDir, src);
      try {
        var imageFile = zipInstance.file(imagePath);
        if (!imageFile) {
          imageFile = zipInstance.file(decodeURIComponent(imagePath));
        }
        if (imageFile) {
          var imageData = await imageFile.async('uint8array');
          var blob = new Blob([imageData], { type: getMimeType(imagePath) });
          img.src = URL.createObjectURL(blob);
        }
      } catch (e) {
        console.warn('Failed to load image:', src, e);
      }
    }
  }
}

function waitForImages() {
  return new Promise(function(resolve) {
    var images = document.querySelectorAll('#content img');
    var total = images.length;
    if (total === 0) { resolve(); return; }
    var loaded = 0;
    function checkDone() {
      loaded++;
      if (loaded >= total) resolve();
    }
    for (var i = 0; i < total; i++) {
      if (images[i].complete && images[i].naturalWidth > 0) {
        checkDone();
      } else {
        images[i].addEventListener('load', checkDone);
        images[i].addEventListener('error', checkDone);
      }
    }
    setTimeout(resolve, 3000);
  });
}

function getDirectChild(element, tagName) {
  for (var i = 0; i < element.childNodes.length; i++) {
    var child = element.childNodes[i];
    if (child.nodeType === 1 && child.tagName.toLowerCase() === tagName.toLowerCase()) {
      return child;
    }
  }
  return null;
}

function parseNcxToc(ncxContent, ncxPath) {
  var items = [];
  try {
    var parser = new DOMParser();
    var doc = parser.parseFromString(ncxContent, 'text/xml');
    var navMap = doc.getElementsByTagName('navMap')[0];
    if (!navMap) return items;

    function processNavPoints(parent, level) {
      for (var i = 0; i < parent.childNodes.length; i++) {
        var child = parent.childNodes[i];
        if (child.nodeType !== 1 || child.tagName.toLowerCase() !== 'navpoint') continue;

        var label = '';
        var navLabel = getDirectChild(child, 'navLabel');
        if (navLabel) {
          var textEl = getDirectChild(navLabel, 'text');
          if (textEl) label = textEl.textContent.trim();
        }

        var src = '';
        var contentEl = getDirectChild(child, 'content');
        if (contentEl) src = contentEl.getAttribute('src') || '';

        if (label && src) {
          items.push({
            title: label,
            href: ncxPath ? resolvePath(ncxPath, src) : src,
            page: 0,
            level: level
          });
        }
        processNavPoints(child, level + 1);
      }
    }
    processNavPoints(navMap, 0);
  } catch (e) {
    console.warn('NCX parse error:', e);
  }
  return items;
}

function parseNavToc(navContent, navPath) {
  var items = [];
  try {
    var parser = new DOMParser();
    var doc = parser.parseFromString(navContent, 'text/html');

    var navs = doc.getElementsByTagName('nav');
    var tocNav = null;
    for (var i = 0; i < navs.length; i++) {
      var epubType = navs[i].getAttribute('epub:type') || '';
      if (epubType.indexOf('toc') >= 0) { tocNav = navs[i]; break; }
    }
    if (!tocNav && navs.length > 0) tocNav = navs[0];
    if (!tocNav) return items;

    function processList(list, level) {
      for (var i = 0; i < list.childNodes.length; i++) {
        var li = list.childNodes[i];
        if (li.nodeType !== 1 || li.tagName.toLowerCase() !== 'li') continue;

        var link = getDirectChild(li, 'a');
        if (link) {
          var title = link.textContent.trim();
          var href = link.getAttribute('href') || '';
          if (title && href && href.charAt(0) !== '#') {
            items.push({
              title: title,
              href: navPath ? resolvePath(navPath, href) : href,
              page: 0,
              level: level
            });
          }
        }
        var ol = getDirectChild(li, 'ol');
        if (ol) processList(ol, level + 1);
      }
    }

    var ol = getDirectChild(tocNav, 'ol');
    if (ol) processList(ol, 0);
  } catch (e) {
    console.warn('Nav parse error:', e);
  }
  return items;
}

async function parseEpubToc(zip, manifest, opfContent, opfDir) {
  var tocItems = [];

  var navMatch = opfContent.match(/<item[^>]*\sproperties\s*=\s*"[^"]*nav[^"]*"[^>]*\/?>/i);
  if (navMatch) {
    var navHrefMatch = navMatch[0].match(/href\s*=\s*"([^"]+)"/);
    if (navHrefMatch) {
      var navHref = navHrefMatch[1];
      var navPath = opfDir ? opfDir + '/' + navHref : navHref;
      var navFile = zip.file(navPath);
      if (navFile) {
        var navContent = await navFile.async('string');
        tocItems = parseNavToc(navContent, navPath);
      }
    }
  }

  if (tocItems.length === 0) {
    var ncxId = null;
    var spineMatch = opfContent.match(/<spine[^>]*\stoc\s*=\s*"([^"]+)"/i);
    if (spineMatch) ncxId = spineMatch[1];

    var ncxHref = null;
    if (ncxId && manifest[ncxId]) {
      ncxHref = manifest[ncxId];
    } else {
      for (var id in manifest) {
        if (/\.ncx$/i.test(manifest[id])) { ncxHref = manifest[id]; break; }
      }
    }

    if (ncxHref) {
      var ncxPath = opfDir ? opfDir + '/' + ncxHref : ncxHref;
      var ncxFile = zip.file(ncxPath);
      if (ncxFile) {
        var ncxContent = await ncxFile.async('string');
        tocItems = parseNcxToc(ncxContent, ncxPath);
      }
    }
  }

  if (tocItems.length === 0) {
    var tocPath = opfDir ? opfDir + '/toc.ncx' : 'toc.ncx';
    var tocFile = zip.file(tocPath);
    if (tocFile) {
      var tocContent = await tocFile.async('string');
      tocItems = parseNcxToc(tocContent, tocPath);
    }
  }

  return tocItems;
}

async function renderEpubFromBase64(base64Data) {
  try {
    var binaryString = atob(base64Data);
    var bytes = new Uint8Array(binaryString.length);
    for (var i = 0; i < binaryString.length; i++) {
      bytes[i] = binaryString.charCodeAt(i);
    }

    zipInstance = await JSZip.loadAsync(bytes);

    var containerFile = zipInstance.file('META-INF/container.xml');
    if (!containerFile) {
      var subDirs = Object.keys(zipInstance.files);
      for (var d = 0; d < subDirs.length; d++) {
        if (subDirs[d].indexOf('META-INF/container.xml') >= 0) {
          containerFile = zipInstance.file(subDirs[d]);
          break;
        }
      }
    }
    if (!containerFile) { showError(); return; }

    var containerXml = await containerFile.async('string');
    var opfPathMatch = containerXml.match(/full-path\s*=\s*"([^"]+)"/);
    var opfPath = opfPathMatch ? opfPathMatch[1] : 'OEBPS/content.opf';
    opfDir = opfPath.indexOf('/') >= 0 ? opfPath.substring(0, opfPath.lastIndexOf('/')) : '';

    var opfFile = zipInstance.file(opfPath);
    if (!opfFile) { showError(); return; }
    var opfContent = await opfFile.async('string');

    var manifest = {};
    var manifestSection = opfContent.match(/<manifest[^>]*>([\s\S]*?)<\/manifest>/i);
    if (manifestSection) {
      var items = manifestSection[1].match(/<item[^>]*\/?>/gi);
      if (items) {
        for (var i = 0; i < items.length; i++) {
          var idMatch = items[i].match(/id\s*=\s*"([^"]+)"/);
          var hrefMatch = items[i].match(/href\s*=\s*"([^"]+)"/);
          if (idMatch && hrefMatch) {
            manifest[idMatch[1]] = hrefMatch[1];
          }
        }
      }
    }

    var spine = [];
    var spineSection = opfContent.match(/<spine[^>]*>([\s\S]*?)<\/spine>/i);
    if (spineSection) {
      var refs = spineSection[1].match(/<itemref[^>]*\/?>/gi);
      if (refs) {
        for (var i = 0; i < refs.length; i++) {
          var idrefMatch = refs[i].match(/idref\s*=\s*"([^"]+)"/);
          if (idrefMatch) {
            spine.push(idrefMatch[1]);
          }
        }
      }
    }

    var cssContent = '';
    var ids = Object.keys(manifest);
    for (var i = 0; i < ids.length; i++) {
      var href = manifest[ids[i]];
      if (href && href.indexOf('.css') === href.length - 4) {
        var cssPath = opfDir ? opfDir + '/' + href : href;
        try {
          var cssFile = zipInstance.file(cssPath);
          if (cssFile) {
            cssContent += await cssFile.async('string') + '\n';
          }
        } catch (e) {}
      }
    }
    document.getElementById('epub-css').textContent = cssContent;

    var bodyContent = '';
    var chapterManifest = [];
    for (var i = 0; i < spine.length; i++) {
      var href = manifest[spine[i]];
      if (href && /\.(x?html?|htm)$/i.test(href)) {
        var chapterPath = opfDir ? opfDir + '/' + href : href;
        chapterManifest.push(chapterPath);
        try {
          var chapterFile = zipInstance.file(chapterPath);
          if (chapterFile) {
            var content = await chapterFile.async('string');
            var bodyMatch = content.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
            var bodyHtml = bodyMatch ? bodyMatch[1] : content;
            var prefix = 'ch' + (chapterManifest.length - 1) + '_';
            bodyHtml = bodyHtml.replace(/\bid\s*=\s*"([^"]+)"/gi, function(m, id) {
              return 'id="' + prefix + id + '"';
            });
            bodyHtml = bodyHtml.replace(/\bid\s*=\s*'([^']+)'/gi, function(m, id) {
              return "id='" + prefix + id + "'";
            });
            bodyContent += '<div class="epub-chapter" data-chapter="' + chapterPath + '" id="ch' + (chapterManifest.length - 1) + '">' + bodyHtml + '</div>\n';
          }
        } catch (e) {}
      }
    }

    hideLoading();
    document.getElementById('content').innerHTML = bodyContent;

    try {
      var tocData = await parseEpubToc(zipInstance, manifest, opfContent, opfDir);
      if (window.readerBridge) {
        window.readerBridge.updateToc(JSON.stringify(tocData));
      }
      renderTocPanel(tocData);
    } catch (e) {
      console.warn('TOC parse error:', e);
      if (window.readerBridge) {
        window.readerBridge.updateToc('[]');
      }
    }

    await processImages();
    await waitForImages();

    if (window.readerBridge) {
      var totalHeight = document.getElementById('content').scrollHeight;
      var totalPages = Math.max(1, Math.ceil(totalHeight / window.innerHeight));
      window.readerBridge.updateTotalPages(totalPages);
      window.readerBridge.onEpubRendered();
    }
  } catch (e) {
    console.error('EPUB render error:', e);
    showError();
  }
}

window.addEventListener('scroll', function() {
  if (window.readerBridge) {
    window.readerBridge.updateScroll(window.scrollY);
  }
});

function closestLink(element) {
  while (element && element !== document) {
    if (element.tagName === 'A') return element;
    element = element.parentElement;
  }
  return null;
}

function closestChapter(element) {
  while (element && element !== document) {
    if (element.classList && element.classList.contains('epub-chapter')) return element;
    element = element.parentElement;
  }
  return null;
}

function navigateToElement(element) {
  if (!element) return;

  if (__pageMode) {
    var content = document.getElementById('content');
    content.style.visibility = 'hidden';
    setPageMode(false);
    element.scrollIntoView();
    var scrollY = window.scrollY;
    setPageMode(true, scrollY);
    content.style.visibility = '';
  } else {
    element.scrollIntoView({ behavior: 'instant', block: 'start' });
    if (window.readerBridge) {
      window.readerBridge.updateScroll(window.scrollY);
    }
  }
}

function navigateToChapter(resolvedHref) {
  var parts = resolvedHref.split('#');
  var chapterPath = parts[0];
  var anchor = parts[1];

  var chapterDiv = document.querySelector('.epub-chapter[data-chapter="' + chapterPath + '"]');
  if (!chapterDiv) {
    var filename = chapterPath.split('/').pop();
    var chapters = document.querySelectorAll('.epub-chapter');
    for (var i = 0; i < chapters.length; i++) {
      var chPath = chapters[i].getAttribute('data-chapter') || '';
      if (chPath.split('/').pop() === filename) { chapterDiv = chapters[i]; break; }
    }
  }
  if (!chapterDiv) return;

  var target = chapterDiv;
  if (anchor) {
    var chId = chapterDiv.id || '';
    var anchorEl = document.getElementById(chId + '_' + anchor);
    if (anchorEl) target = anchorEl;
  }
  navigateToElement(target);
}

function handleContentClick(e) {
  var link = closestLink(e.target);
  if (!link) return;

  var href = link.getAttribute('href');
  if (!href || href.indexOf('http') === 0 || href.indexOf('mailto:') === 0) return;

  e.preventDefault();
  e.stopPropagation();

  if (href.charAt(0) === '#') {
    var anchor = href.substring(1);
    var chapterDiv = closestChapter(link);
    if (chapterDiv) {
      var target = document.getElementById(chapterDiv.id + '_' + anchor);
      if (target) { navigateToElement(target); return; }
    }
    var fallback = document.getElementById(anchor);
    if (fallback) navigateToElement(fallback);
  } else {
    var chDiv = closestChapter(link);
    var chPath = chDiv ? chDiv.getAttribute('data-chapter') : '';
    var resolved = chPath ? resolvePath(chPath, href) : href;
    navigateToChapter(resolved);
  }
}

function renderTocPanel(tocData) {
  var listEl = document.getElementById('toc-list');
  if (!listEl) return;
  listEl.innerHTML = '';

  if (!tocData || tocData.length === 0) {
    var empty = document.createElement('div');
    empty.className = 'toc-empty';
    empty.textContent = '当前书籍没有章节划分';
    listEl.appendChild(empty);
    return;
  }

  for (var i = 0; i < tocData.length; i++) {
    var item = document.createElement('a');
    item.className = 'toc-item';
    item.textContent = tocData[i].title;
    item.style.paddingLeft = (20 + tocData[i].level * 16) + 'px';
    (function(h) {
      item.onclick = function(ev) {
        ev.preventDefault();
        closeTocPanel();
        navigateToChapter(h);
      };
    })(tocData[i].href);
    listEl.appendChild(item);
  }
}

function openTocPanel() {
  var panel = document.getElementById('toc-panel');
  var overlay = document.getElementById('toc-overlay');
  if (panel) panel.classList.add('open');
  if (overlay) overlay.classList.add('show');
}

function closeTocPanel() {
  var panel = document.getElementById('toc-panel');
  var overlay = document.getElementById('toc-overlay');
  if (panel) panel.classList.remove('open');
  if (overlay) overlay.classList.remove('show');
}

window.goToChapter = function(href) {
  navigateToChapter(href);
};

window.setDarkMode = function(enabled) {
  if (enabled) {
    document.body.classList.add('dark-mode');
  } else {
    document.body.classList.remove('dark-mode');
  }
};

window.openToc = function() {
  openTocPanel();
};

window.closeToc = function() {
  closeTocPanel();
};

(function() {
  var closeBtn = document.getElementById('toc-close-btn');
  if (closeBtn) closeBtn.addEventListener('click', closeTocPanel);
  var overlay = document.getElementById('toc-overlay');
  if (overlay) overlay.addEventListener('click', closeTocPanel);
  var content = document.getElementById('content');
  if (content) content.addEventListener('click', handleContentClick);
})();

var __pageMode = false;
var __touchStartX = 0;
var __touchStartY = 0;
var __touchMoved = false;
var __currentPage = 0;
var __scrollPos = 0;

document.addEventListener('touchstart', function(e) {
  __touchStartX = e.touches[0].clientX;
  __touchStartY = e.touches[0].clientY;
  __touchMoved = false;
}, { passive: true });

document.addEventListener('touchmove', function() {
  __touchMoved = true;
}, { passive: true });

document.addEventListener('touchend', function(e) {
  if (!__touchMoved) {
    var link = closestLink(e.target);
    if (link) {
      var href = link.getAttribute('href');
      if (href && href.indexOf('http') !== 0 && href.indexOf('mailto:') !== 0) return;
    }
    if (window.readerBridge) {
      window.readerBridge.requestToggleMenu();
    }
    return;
  }
  if (__pageMode) {
    var dx = e.changedTouches[0].clientX - __touchStartX;
    if (dx < -50) {
      __currentPage = Math.min(__currentPage + 1, getTotalPages() - 1);
      slideToCurrentPage();
    } else if (dx > 50) {
      __currentPage = Math.max(__currentPage - 1, 0);
      slideToCurrentPage();
    }
  }
});

var __totalPages = 1;

function getTotalPages() {
  return __totalPages;
}

function slideToCurrentPage() {
  var content = document.getElementById('content');
  if (!content) return;
  var pageWidth = window.innerWidth;
  var pageHeight = window.innerHeight;
  var offsetX = -__currentPage * pageWidth;
  content.style.transition = 'transform 0.3s ease-in-out';
  content.style.transform = 'translateX(' + offsetX + 'px)';
  if (window.readerBridge) {
    window.readerBridge.updateScroll(__currentPage * pageHeight);
  }
}

var __pageRecalcTimer = null;

function applyImageConstraints(pageMode, pageHeight) {
  var images = document.querySelectorAll('#content img');
  for (var i = 0; i < images.length; i++) {
    if (pageMode) {
      images[i].style.maxHeight = Math.floor(pageHeight * 0.9) + 'px';
      images[i].style.objectFit = 'contain';

      images[i].style.objectFit = '';
    }
  }
}

function recalcPageLayout() {
  var content = document.getElementById('content');
  if (!content || !__pageMode) return;
  var pageWidth = window.innerWidth;
  var pageHeight = window.innerHeight;
  var padH = 20;
  var colWidth = pageWidth - padH * 2;

  content.style.visibility = 'hidden';
  content.style.height = '';
  content.style.columnWidth = '';
  content.style.columnFill = '';
  content.style.columnGap = '';
  content.style.boxSizing = 'border-box';
  content.style.padding = '20px';
  content.style.width = '';
  content.style.transform = 'none';

  var totalHeight = content.scrollHeight;
  var newTotalPages = Math.max(1, Math.ceil(totalHeight / pageHeight));

  content.style.boxSizing = 'content-box';
  content.style.paddingTop = '0';
  content.style.paddingBottom = '0';
  content.style.paddingLeft = padH + 'px';
  content.style.paddingRight = padH + 'px';
  content.style.width = (newTotalPages * pageWidth + padH * 2) + 'px';
  content.style.height = pageHeight + 'px';
  content.style.columnWidth = colWidth + 'px';
  content.style.columnGap = (padH * 2) + 'px';
  content.style.columnFill = 'auto';
  content.style.visibility = '';
  content.style.transform = 'translateX(' + (-__currentPage * pageWidth) + 'px)';

  if (newTotalPages !== __totalPages) {
    __totalPages = newTotalPages;
    if (__currentPage >= __totalPages) {
      __currentPage = __totalPages - 1;
      content.style.transform = 'translateX(' + (-__currentPage * pageWidth) + 'px)';
    }
    if (window.readerBridge) {
      window.readerBridge.updateTotalPages(__totalPages);
    }
  }
}

window.setPageMode = function(enabled, initialScrollY) {
  if (__pageRecalcTimer) {
    clearTimeout(__pageRecalcTimer);

  }

  var pageHeight = window.innerHeight;

    __scrollPos = (initialScrollY !== undefined && initialScrollY > 0) ? initialScrollY : window.scrollY;

    var padH = 20;
    var colWidth = pageWidth - padH * 2;

    content.style.paddingBottom = '0';
    content.style.paddingLeft = padH + 'px';

    content.style.height = pageHeight + 'px';
    content.style.columnWidth = colWidth + 'px';
    content.style.columnGap = (padH * 2) + 'px';
    content.style.columnFill = 'auto';
    content.style.overflow = 'visible';
    content.style.transform = 'translateX(0)';
    content.style.transition = 'none';

    document.body.style.overflow = 'hidden';
    document.documentElement.style.overflow = 'hidden';
    document.body.style.width = pageWidth + 'px';
    document.body.style.height = pageHeight + 'px';

    __currentPage = Math.min(Math.floor(__scrollPos / pageHeight), __totalPages - 1);
    content.style.transform = 'translateX(' + (-__currentPage * pageWidth) + 'px)';

    __pageRecalcTimer = setTimeout(function() {
      recalcPageLayout();
    }, 1000);
  } else {
    applyImageConstraints(false, 0);

    content.style.boxSizing = '';
    content.style.paddingTop = '';
    content.style.paddingBottom = '';
    content.style.paddingLeft = '';
    content.style.paddingRight = '';
    content.style.width = '';
    content.style.height = '';
    content.style.columnWidth = '';
    content.style.columnGap = '';
    content.style.columnFill = '';
    content.style.overflow = '';
    content.style.transform = '';
    content.style.transition = '';

    document.body.style.overflow = '';
    document.documentElement.style.overflow = '';
    document.body.style.width = '';
    document.body.style.height = '';

    __totalPages = 1;
    window.scrollTo(0, __currentPage * pageHeight);
  }
};

var __refreshTimer = null;

window.refreshPageLayout = function() {
  if (!__pageMode) return;
  if (__refreshTimer) clearTimeout(__refreshTimer);
  __refreshTimer = setTimeout(function() {
    __refreshTimer = null;
    doRefreshPageLayout();
  }, 200);
};

function doRefreshPageLayout() {
  if (__pageRecalcTimer) {
    clearTimeout(__pageRecalcTimer);
    __pageRecalcTimer = null;
  }
  var content = document.getElementById('content');
  if (!content || !__pageMode) return;
  var pageWidth = window.innerWidth;
  var pageHeight = window.innerHeight;
  var savedProgress = __totalPages > 1 ? __currentPage / (__totalPages - 1) : 0;

  content.style.visibility = 'hidden';
  content.style.height = '';
  content.style.columnWidth = '';
  content.style.columnFill = '';
  content.style.columnGap = '';
  content.style.overflow = '';
  content.style.boxSizing = 'border-box';
  content.style.padding = '20px';
  content.style.width = '';
  content.style.transform = 'none';
  content.style.transition = 'none';

  void content.offsetHeight;

  applyImageConstraints(true, pageHeight);
  void content.offsetHeight;

  var totalHeight = content.scrollHeight;
  var padH = 20;
  var colWidth = pageWidth - padH * 2;
  __totalPages = Math.max(1, Math.ceil(totalHeight / pageHeight));

  content.style.boxSizing = 'content-box';
  content.style.paddingTop = '0';
  content.style.paddingBottom = '0';
  content.style.paddingLeft = padH + 'px';
  content.style.paddingRight = padH + 'px';

  content.style.height = pageHeight + 'px';
  content.style.columnWidth = colWidth + 'px';
  content.style.columnGap = (padH * 2) + 'px';
  content.style.columnFill = 'auto';

  content.style.visibility = '';

  __currentPage = Math.min(Math.round(savedProgress * Math.max(1, __totalPages - 1)), __totalPages - 1);
  content.style.transform = 'translateX(' + (-__currentPage * pageWidth) + 'px)';

  if (window.readerBridge) {
    window.readerBridge.updateTotalPages(__totalPages);
    window.readerBridge.updateScroll(__currentPage * pageHeight);
  }
}

window.addEventListener('resize', function() {
  if (typeof window.refreshPageLayout === 'function') {
    window.refreshPageLayout();
  }
});
